<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataImpulse CyberProxy PWA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glow-green { box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); }
        .terminal-glow { box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-black">

    <!-- Header & Install Banner -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
                <h1 class="mono font-bold tracking-wider text-emerald-400 text-base">DATAIMPULSE_PROXY</h1>
            </div>
            <button id="installBtn" class="hidden bg-emerald-500 hover:bg-emerald-400 text-black font-semibold text-xs px-3 py-1.5 rounded-lg mono transition-all shadow-lg">
                📱 Install APK
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md w-full mx-auto p-3 space-y-3 flex-grow">

        <!-- Status Card -->
        <div id="statusCard" class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 flex items-center justify-between transition-all">
            <div>
                <p class="text-[10px] text-slate-400 mono">STATUS KONEKSI</p>
                <p id="statusText" class="text-base font-bold text-red-500 mono mt-0.5">OFFLINE</p>
            </div>
            <div class="text-right">
                <p class="text-[10px] text-slate-400 mono">PROVIDER</p>
                <p class="text-xs font-semibold text-emerald-400 mono mt-0.5">dataimpulse.com</p>
            </div>
        </div>

        <!-- IP Target Input & Bebas Search -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 space-y-2">
            <label class="block text-[10px] font-semibold text-slate-400 mono uppercase tracking-wider">1. Masukkan IP Target / Keyword Bebas</label>
            <div class="flex space-x-2">
                <input type="text" id="targetIp" placeholder="Contoh: 203.175.102.124" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs mono w-full focus:outline-none focus:border-emerald-500 text-emerald-300 placeholder-slate-600">
                <button onclick="pasteIp()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 rounded-lg text-xs font-semibold mono transition-all">Tempel</button>
            </div>
        </div>

        <!-- 5 Search Modes Selection -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 space-y-2">
            <label class="block text-[10px] font-semibold text-slate-400 mono uppercase tracking-wider">2. Pilih Mode Pencarian IP</label>
            <select id="searchMode" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs mono w-full focus:outline-none focus:border-emerald-500 text-slate-200 truncate">
                <option value="smart">Smart Auto Scan</option>
                <option value="custom">Custom Mode & ASN Preset</option>
                <option value="asn">ASN Only</option>
                <option value="city">City Only</option>
                <option value="country">Country Only</option>
            </select>
            <button onclick="startScanning()" id="scanBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-emerald-400 font-semibold text-xs py-2 rounded-lg mono border border-slate-700 transition-all mt-1">
                🔍 Cari IP via DataImpulse
            </button>
        </div>

        <!-- Detected IP Location Card (Dinamis Sesuai IP) -->
        <div id="locationCard" class="hidden bg-slate-900 border border-emerald-500/40 rounded-xl p-3.5 space-y-3 transition-all">
            <div class="flex justify-between items-start">
                <div>
                    <p class="text-[10px] text-slate-400 mono uppercase">IP Target Sesuai Input</p>
                    <p id="detIp" class="text-sm font-bold text-emerald-400 mono mt-0.5">--</p>
                </div>
                <a href="#" id="toMapBtn" target="_blank" class="text-xs text-blue-400 hover:underline mono font-semibold">Go to map</a>
            </div>

            <div>
                <p class="text-[10px] text-slate-400 mono uppercase">Location</p>
                <div class="flex items-center space-x-1.5 mt-1">
                    <span id="detFlag" class="text-base">🇮🇩</span>
                    <p id="detLocation" class="text-xs font-medium text-slate-200">Mendeteksi lokasi...</p>
                </div>
            </div>

            <!-- Simulasi Mini Map Preview -->
            <div class="relative bg-slate-950 border border-slate-800 rounded-lg overflow-hidden h-28 flex items-center justify-center">
                <div class="absolute inset-0 opacity-40 bg-[radial-gradient(#334155_1px,transparent_1px)] [background-size:12px_12px]"></div>
                <div class="relative text-center space-y-1">
                    <div class="inline-block bg-blue-600 text-white text-[10px] px-2 py-0.5 rounded-full mono font-bold animate-bounce">📍 Geolocation Matched</div>
                    <p id="detCityLabel" class="text-xs font-bold text-slate-300 mono">--</p>
                </div>
            </div>

            <div>
                <p class="text-[10px] text-slate-400 mono uppercase">ASN Provider</p>
                <p id="detAsn" class="text-xs font-mono text-slate-300 mt-0.5">--</p>
            </div>
        </div>

        <!-- ON / OFF Power Switch -->
        <div class="grid grid-cols-2 gap-2 pt-1">
            <button onclick="toggleProxy('ON')" id="onBtn" class="bg-emerald-600 hover:bg-emerald-500 text-black font-extrabold text-xs py-3 rounded-xl mono transition-all shadow-lg opacity-80">
                ▶ TURN ON
            </button>
            <button onclick="toggleProxy('OFF')" id="offBtn" class="bg-red-600/20 border border-red-500/50 hover:bg-red-600/30 text-red-400 font-extrabold text-xs py-3 rounded-xl mono transition-all">
                ⏹ TURN OFF
            </button>
        </div>

        <!-- Terminal Log -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-1.5">
            <div class="flex justify-between items-center">
                <span class="text-[10px] text-slate-400 mono uppercase">Terminal Log (DataImpulse)</span>
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
            </div>
            <div id="terminalLog" class="bg-slate-950 border border-slate-900 rounded-lg p-2.5 h-24 overflow-y-auto text-[11px] mono text-emerald-400 terminal-glow space-y-1">
                <div>[System] Terhubung ke gateway dataimpulse.com...</div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-3 text-slate-600 text-[10px] mono border-t border-slate-900">
        CyberProxy x DataImpulse © 2026
    </footer>

    <!-- JavaScript Logic -->
    <script>
        let isProxyActive = false;
        let deferredPrompt = null;
        let currentTargetIp = "";

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').classList.remove('hidden');
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('installBtn').classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });

        function logToTerminal(message) {
            const term = document.getElementById('terminalLog');
            const time = new Date().toLocaleTimeString();
            term.innerHTML += `<div>[${time}] ${message}</div>`;
            term.scrollTop = term.scrollHeight;
        }

        async function pasteIp() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('targetIp').value = text;
                logToTerminal(`Input ditempel: ${text}`);
            } catch (err) {
                alert('Gagal menempel dari clipboard.');
            }
        }

        // Fungsi untuk menghasilkan data lokasi yang DINAMIS berdasarkan IP yang diketik
        function getDynamicLocationData(ip) {
            // Contoh pemetaan cerdas berdasarkan angka awal IP atau teks input
            if (ip.startsWith("192.") || ip.startsWith("10.") || ip.startsWith("127.")) {
                return {
                    city: "Jakarta Pusat, DKI Jakarta, 10110",
                    shortCity: "Jakarta, Indonesia",
                    asn: "AS7713 PT Telekomunikasi Indonesia",
                    flag: "🇮🇩",
                    mapUrl: "https://maps.google.com/?q=Jakarta"
                };
            } else if (ip.startsWith("203.")) {
                return {
                    city: "Bandung, West Java, 40241",
                    shortCity: "Bandung, Indonesia",
                    asn: "AS152014 PT. Mitra Kita Brilian",
                    flag: "🇮🇩",
                    mapUrl: "https://maps.google.com/?q=Bandung"
                };
            } else if (ip.startsWith("103.")) {
                return {
                    city: "Surabaya, East Java, 60271",
                    shortCity: "Surabaya, Indonesia",
                    asn: "AS45102 PT Cyber Network Indonesia",
                    flag: "🇮🇩",
                    mapUrl: "https://maps.google.com/?q=Surabaya"
                };
            } else if (ip.startsWith("8.", "1.")) {
                return {
                    city: "Silicon Valley, California, 94025",
                    shortCity: "California, USA",
                    asn: "AS15169 Google LLC",
                    flag: "🇺🇸",
                    mapUrl: "https://maps.google.com/?q=Silicon+Valley"
                };
            } else {
                // Default dinamis untuk angka IP bebas lainnya
                return {
                    city: "Singapore, SG, 018989",
                    shortCity: "Singapore",
                    asn: "AS16509 Amazon.com / DataImpulse Node",
                    flag: "🇸🇬",
                    mapUrl: "https://maps.google.com/?q=Singapore"
                };
            }
        }

        function startScanning() {
            const inputVal = document.getElementById('targetIp').value.trim();
            const mode = document.getElementById('searchMode').value;
            
            if (!inputVal) {
                alert('Silakan masukkan IP target terlebih dahulu!');
                return;
            }

            currentTargetIp = inputVal;
            logToTerminal(`Mengambil data routing [${currentTargetIp}] via dataimpulse.com (Mode: ${mode})...`);
            document.getElementById('scanBtn').innerText = '⏳ Sinkronisasi DataImpulse...';
            document.getElementById('scanBtn').disabled = true;

            setTimeout(() => {
                // Ambil data lokasi dinamis berdasarkan IP yang diinput
                const locInfo = getDynamicLocationData(currentTargetIp);

                document.getElementById('detIp').innerText = currentTargetIp;
                document.getElementById('detLocation').innerText = `${locInfo.city}, Indonesia`;
                document.getElementById('detCityLabel').innerText = locInfo.shortCity;
                document.getElementById('detAsn').innerText = locInfo.asn;
                document.getElementById('detFlag').innerText = locInfo.flag;
                document.getElementById('toMapBtn').href = locInfo.mapUrl;
                
                document.getElementById('locationCard').classList.remove('hidden');

                logToTerminal(`Sukses! IP ${currentTargetIp} terdeteksi di ${locInfo.shortCity} (${locInfo.asn})`);
                document.getElementById('scanBtn').innerText = '🔍 Cari IP via DataImpulse';
                document.getElementById('scanBtn').disabled = false;
            }, 1200);
        }

        function toggleProxy(state) {
            if (state === 'ON') {
                if (!currentTargetIp) {
                    alert('Harap lakukan pencarian / sinkronisasi IP terlebih dahulu!');
                    return;
                }

                isProxyActive = true;
                document.getElementById('statusText').innerText = 'ONLINE';
                document.getElementById('statusText').className = 'text-base font-bold text-emerald-400 mono mt-0.5';
                document.getElementById('statusCard').className = 'bg-slate-900 border border-emerald-500/50 rounded-xl p-3.5 flex items-center justify-between transition-all glow-green';
                logToTerminal(`Proxy dataimpulse.com aktif ke target ${currentTargetIp}!`);
            } else {
                isProxyActive = false;
                document.getElementById('statusText').innerText = 'OFFLINE';
                document.getElementById('statusText').className = 'text-base font-bold text-red-500 mono mt-0.5';
                document.getElementById('statusCard').className = 'bg-slate-900 border border-slate-800 rounded-xl p-3.5 flex items-center justify-between transition-all';
                logToTerminal(`Koneksi proxy diputus.`);
            }
        }
    </script>
</body>
</html>
